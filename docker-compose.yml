version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lottery
      POSTGRES_USER: lottery
      POSTGRES_PASSWORD: lottery
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run db:generate && npm run db:migrate && npm run dev:server"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
    ports:
      - '4000:4000'
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - postgres

volumes:
  postgres_data:
