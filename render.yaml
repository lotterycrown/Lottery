services:
  - type: web
    name: crown-tap-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: yarn install && yarn build && yarn prisma:migrate:prod
    startCommand: yarn start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crown-tap-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: info

databases:
  - name: crown-tap-db
    plan: free
