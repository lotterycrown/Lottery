<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <meta
      name="theme-color"
      content="#07080d"
    />

    <meta
      name="description"
      content="Lottery Arcade - Virtual Token Mini Games"
    />

    <title>Lottery Arcade</title>

    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #07080d;
      }

      body {
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      * {
        -webkit-tap-highlight-color: transparent;
      }

      button {
        -webkit-appearance: none;
      }

      /* Loading screen */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(
            circle at 50% 35%,
            rgba(117, 92, 255, 0.25),
            transparent 35%
          ),
          #07080d;
        color: white;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .loading-box {
        text-align: center;
      }

      .loading-logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        font-size: 30px;
        background: linear-gradient(135deg, #755cff, #b15cff);
        box-shadow: 0 15px 50px rgba(117, 92, 255, 0.35);
        animation: loadingFloat 1.5s ease-in-out infinite;
      }

      .loading-title {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 2px;
      }

      .loading-text {
        margin-top: 7px;
        font-size: 11px;
        opacity: 0.45;
      }

      @keyframes loadingFloat {
        50% {
          transform: translateY(-7px);
        }
      }
    </style>
  </head>

  <body>
    <!-- Loading screen -->
    <div id="loading">
      <div class="loading-box">
        <div class="loading-logo">✦</div>
        <div class="loading-title">LOTTERY ARCADE</div>
        <div class="loading-text">Loading games...</div>
      </div>
    </div>

    <!-- React app -->
    <div id="root"></div>

    <!-- Main JavaScript entry -->
    <script type="module" src="/src/main.jsx"></script>

    <script>
      window.addEventListener("load", function () {
        const loading = document.getElementById("loading");

        setTimeout(function () {
          if (loading) {
            loading.style.opacity = "0";
            loading.style.pointerEvents = "none";
            loading.style.transition = "opacity 0.35s ease";

            setTimeout(function () {
              loading.remove();
            }, 400);
          }
        }, 500);
      });
    </script>
  </body>
</html>
